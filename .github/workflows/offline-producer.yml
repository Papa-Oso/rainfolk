name: Offline producer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: producer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      USGS_API_KEY: ""
      OPENAI_API_KEY: ""
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify producer and workflow files
        run: python -B scripts/check-workflow.py
      - name: Prepare documented toolchain and locked dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 fetch --locked --manifest-path crates/us-groundwater/Cargo.toml
      - name: Offline build
        run: cargo +1.99.1 build --offline --locked --manifest-path crates/us-groundwater/Cargo.toml --bins
      - name: Offline Rust tests
        run: cargo +1.99.1 test --offline --locked --manifest-path crates/us-groundwater/Cargo.toml
      - name: Formatting
        run: cargo +1.99.1 fmt --manifest-path crates/us-groundwater/Cargo.toml -- --check
      - name: Offline transport tests
        run: python -B -m unittest discover -s scripts -p test_capture_usgs_inventory.py
      - name: Replay and tamper fixture
        run: python -B examples/offline.py
