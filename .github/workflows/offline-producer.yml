name: Offline producer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: producer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      USGS_API_KEY: ""
      OPENAI_API_KEY: ""
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node24
        with:
          python-version: "3.13"
      - name: Verify producer and workflow files
        run: python -B scripts/check-workflow.py
      - name: Prepare documented toolchain and locked dependencies
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.99.1 fetch --locked --manifest-path crates/us-groundwater/Cargo.toml
      - name: Offline build
        run: cargo +1.99.1 build --offline --locked --manifest-path crates/us-groundwater/Cargo.toml --bins
      - name: Offline Rust tests
        run: cargo +1.99.1 test --offline --locked --manifest-path crates/us-groundwater/Cargo.toml
      - name: Formatting
        run: cargo +1.99.1 fmt --manifest-path crates/us-groundwater/Cargo.toml -- --check
      - name: Offline transport tests
        run: python -B -m unittest discover -s scripts -p 'test_capture*.py'
      - name: Historical browser-contract tests
        run: node --test integrations/gev/historicalPack.test.mjs integrations/gev/dataBase.test.mjs
      - name: Replay and tamper fixture
        run: python -B examples/offline.py
      - name: Replay synthetic SDR fixture
        run: python -B examples/texas_sdr_offline.py
