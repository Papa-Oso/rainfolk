[package]
name = "gev-us-groundwater"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Joshua Koelker"]
publish = false
default-run = "gev-us-groundwater"
description = "Bounded offline USGS groundwater-well validation and artifact export"

[[bin]]
name = "well-jobs"
path = "src/bin/well_jobs.rs"

[dependencies]
serde = "=1.0.229"
sha2 = "=0.10.9"
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
